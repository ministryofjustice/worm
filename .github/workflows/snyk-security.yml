name: Snyk Security

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '12 8 * * 2'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  snyk:
    permissions:
      actions: read
      contents: read
      statuses: read
      security-events: write
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04

      # Run Snyk Code (SAST) analysis and produce SARIF for GitHub Code Scanning.
      - name: Code (SAST) test
        run: snyk code test --sarif > snyk-code.sarif
        continue-on-error: true

      - name: PHP dependency test
        uses: snyk/actions/php@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        continue-on-error: true

      # Snyk writes an empty file when it cannot authenticate, e.g. on Dependabot
      # and fork PRs, where SNYK_TOKEN is not available. Uploading that fails the
      # job, so only upload a SARIF file that actually parsed.
      - name: Check SARIF output
        id: sarif
        run: |
          if [ -s snyk-code.sarif ] && jq -e '.runs' snyk-code.sarif > /dev/null 2>&1; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Snyk produced no valid SARIF, skipping upload to code scanning."
          fi

      - name: Upload result to GitHub Code Scanning
        if: steps.sarif.outputs.valid == 'true'
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: snyk-code.sarif
